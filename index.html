<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스 모니터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #070b14;
    --surface:  #0d1424;
    --surface2: #111c30;
    --border:   #1a2840;
    --border2:  #243550;
    --green:    #00e87a;
    --blue:     #38bdf8;
    --yellow:   #fbbf24;
    --purple:   #a78bfa;
    --red:      #ff3e5e;
    --text:     #cdd9f0;
    --muted:    #4a6080;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Noto Sans KR', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,232,122,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,232,122,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
  }

  /* ── 헤더 ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
    color: var(--blue);
    letter-spacing: 1px;
  }

  .logo-icon {
    width: 28px; height: 28px;
    background: var(--blue);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  #updated-time {
    color: var(--green);
  }

  /* ── 탭 ── */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .tab {
    padding: 8px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all .2s;
    text-transform: uppercase;
  }

  .tab:hover { border-color: var(--border2); color: var(--text); }

  .tab.active {
    background: var(--surface2);
    border-color: var(--blue);
    color: var(--blue);
  }

  /* ── 필터 바 ── */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 5px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .filter-btn:hover { border-color: var(--border2); color: var(--text); }

  .filter-btn.active {
    background: var(--surface2);
    border-color: var(--purple);
    color: var(--purple);
  }

  /* ── 뉴스 그리드 ── */
  .news-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }

  /* ── 뉴스 카드 ── */
  .news-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    transition: all .2s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: block;
    color: inherit;
  }

  .news-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .news-card.cat-IT::before      { background: var(--blue); }
  .news-card.cat-과학::before    { background: var(--green); }
  .news-card.cat-보유종목::before { background: var(--yellow); }
  .news-card.cat-의료::before    { background: #f97316; }
  .news-card.cat-기이::before    { background: #e879f9; }
  .news-card.cat-흥미::before    { background: #14b8a6; }

  .news-card:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .cat-badge {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .cat-badge.IT       { background: rgba(56,189,248,0.15);  color: var(--blue); }
  .cat-badge.과학     { background: rgba(0,232,122,0.15);   color: var(--green); }
  .cat-badge.보유종목 { background: rgba(251,191,36,0.15);  color: var(--yellow); }
  .cat-badge.의료     { background: rgba(249,115,22,0.15);  color: #f97316; }
  .cat-badge.기이     { background: rgba(232,121,249,0.15); color: #e879f9; }
  .cat-badge.흥미     { background: rgba(20,184,166,0.15);  color: #14b8a6; }

  .stock-tag {
    font-family: var(--mono);
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 20px;
    background: rgba(167,139,250,0.15);
    color: var(--purple);
  }

  .card-date {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 8px;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-summary {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .card-source {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-source::before {
    content: '↗';
    color: var(--border2);
  }

  /* ── 빈 상태 ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
  }

  /* ── 로딩 ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    gap: 10px;
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border2);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 통계 바 ── */
  .stats-bar {
    display: flex;
    gap: 20px;
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .stat-item span { color: var(--text); font-weight: 600; }

  /* ── 대시보드 링크 ── */
  .back-link {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    transition: color .2s;
  }
  .back-link:hover { color: var(--green); }
</style>
</head>
<body>
<div class="wrap">

  <!-- 헤더 -->
  <header>
    <div class="logo">
      <div class="logo-icon">📰</div>
      NEWS MONITOR
    </div>
    <div class="header-right">
      <span>업데이트: <span id="updated-time">--</span></span>
      <a class="back-link" href="http://168.107.56.144:5000">← 매매 대시보드</a>
    </div>
  </header>

  <!-- 탭 -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('all')">전체</button>
    <button class="tab" onclick="switchTab('holdings')">📈 보유종목</button>
    <button class="tab" onclick="switchTab('tech')">💻 테크 · 과학 · 의료 · 기이</button>
  </div>

  <!-- 통계 바 -->
  <div class="stats-bar">
    <div class="stat-item">보유종목 <span id="stat-holdings">0</span>건</div>
    <div class="stat-item">IT <span id="stat-it">0</span>건</div>
    <div class="stat-item">과학 <span id="stat-sci">0</span>건</div>
    <div class="stat-item">의료 <span id="stat-med">0</span>건</div>
    <div class="stat-item">기이 <span id="stat-weird">0</span>건</div>
    <div class="stat-item">흥미 <span id="stat-fun">0</span>건</div>
    <div class="stat-item">총 <span id="stat-total">0</span>건</div>
  </div>

  <!-- 필터 (tech 탭에서만 표시) -->
  <div class="filter-bar" id="filter-bar" style="display:none">
    <button class="filter-btn active" onclick="setFilter('all')">전체</button>
    <button class="filter-btn" onclick="setFilter('IT')">IT</button>
    <button class="filter-btn" onclick="setFilter('과학')">과학</button>
    <button class="filter-btn" onclick="setFilter('의료')">의료</button>
    <button class="filter-btn" onclick="setFilter('기이')">기이한사건</button>
    <button class="filter-btn" onclick="setFilter('흥미')">흥미</button>
  </div>

  <!-- 뉴스 그리드 -->
  <div id="news-container">
    <div class="loading">
      <div class="spinner"></div>
      뉴스 불러오는 중...
    </div>
  </div>

</div>

<script>
let allData    = null;
let activeTab  = 'all';
let activeFilter = 'all';

// 뉴스 데이터 로드
async function loadNews() {
  try {
    const res  = await fetch('./news.json?t=' + Date.now());
    allData    = await res.json();
    document.getElementById('updated-time').textContent = allData.updated || '--';
    updateStats();
    render();
  } catch(e) {
    document.getElementById('news-container').innerHTML =
      '<div class="loading">❌ news.json 로드 실패 — 크롤러 실행 여부를 확인하세요</div>';
  }
}

function updateStats() {
  if (!allData) return;
  const holdings = allData.holdings || [];
  const tech     = allData.tech || [];
  const it    = tech.filter(n => n.category === 'IT');
  const sci   = tech.filter(n => n.category === '과학');
  const med   = tech.filter(n => n.category === '의료');
  const weird = tech.filter(n => n.category === '기이');
  const fun   = tech.filter(n => n.category === '흥미');
  document.getElementById('stat-holdings').textContent = holdings.length;
  document.getElementById('stat-it').textContent       = it.length;
  document.getElementById('stat-sci').textContent      = sci.length;
  document.getElementById('stat-med').textContent      = med.length;
  document.getElementById('stat-weird').textContent    = weird.length;
  document.getElementById('stat-fun').textContent      = fun.length;
  document.getElementById('stat-total').textContent    = holdings.length + tech.length;
}

function switchTab(tab) {
  activeTab = tab;
  activeFilter = 'all';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('filter-bar').style.display = (tab === 'tech') ? 'flex' : 'none';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn')?.classList.add('active');
  render();
}

function setFilter(filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function getItems() {
  if (!allData) return [];
  const holdings = allData.holdings || [];
  const tech     = allData.tech || [];

  if (activeTab === 'holdings') return holdings;
  if (activeTab === 'tech') {
    return activeFilter === 'all' ? tech : tech.filter(n => n.category === activeFilter);
  }
  // 전체: 보유종목 먼저, 그 다음 tech
  return [...holdings, ...tech];
}

function render() {
  const items = getItems();
  const container = document.getElementById('news-container');

  if (items.length === 0) {
    container.innerHTML = `
      <div class="news-grid">
        <div class="empty-state">📭 뉴스 없음</div>
      </div>`;
    return;
  }

  container.innerHTML = `
    <div class="news-grid">
      ${items.map(item => cardHTML(item)).join('')}
    </div>`;
}

function cardHTML(item) {
  const cat   = item.category || 'IT';
  const stock = item.stock ? `<span class="stock-tag">📌 ${item.stock}</span>` : '';
  return `
    <a class="news-card cat-${cat}" href="${item.url || '#'}" target="_blank" rel="noopener">
      <div class="card-meta">
        <span class="cat-badge ${cat}">${cat}</span>
        ${stock}
        <span class="card-date">${(item.date || '').slice(5)}</span>
      </div>
      <div class="card-title">${item.title || '(제목 없음)'}</div>
      <div class="card-summary">${item.summary || ''}</div>
      <div class="card-source">${item.source || ''}</div>
    </a>`;
}

loadNews();
// 30분마다 자동 새로고침
setInterval(loadNews, 30 * 60 * 1000);
</script>
</body>
</html>
