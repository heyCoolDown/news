<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스 모니터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #070b14;
    --surface:  #0d1424;
    --surface2: #111c30;
    --border:   #1a2840;
    --border2:  #243550;
    --green:    #00e87a;
    --blue:     #38bdf8;
    --yellow:   #fbbf24;
    --purple:   #a78bfa;
    --red:      #ff3e5e;
    --text:     #cdd9f0;
    --muted:    #4a6080;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Noto Sans KR', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,232,122,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,232,122,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── 헤더 ── */
  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 14px;
    color: var(--blue);
    letter-spacing: 1px;
  }

  .logo-icon {
    width: 26px; height: 26px;
    background: var(--blue);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }

  #updated-time {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
  }

  /* ── 탭 ── */
  .tabs {
    position: relative;
    z-index: 10;
    display: flex;
    gap: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 1;
    padding: 11px 10px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 0.3px;
    white-space: nowrap;
    transition: all .2s;
  }

  .tab.active {
    border-bottom-color: var(--blue);
    color: var(--blue);
  }

  /* ── 필터 바 ── */
  .filter-bar {
    position: relative;
    z-index: 10;
    display: none;
    gap: 8px;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-bar.visible { display: flex; }

  .filter-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .filter-btn.active {
    background: var(--surface2);
    border-color: var(--purple);
    color: var(--purple);
  }

  /* ── 카운터 ── */
  .card-counter {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    flex-shrink: 0;
  }

  #counter-current { color: var(--blue); font-weight: 700; }

  /* ── 카드 슬라이더 ── */
  .card-slider {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    overscroll-behavior-x: contain;
  }
  .card-slider::-webkit-scrollbar { display: none; }

  /* ── 카드 ── */
  .news-card {
    flex: 0 0 100%;
    scroll-snap-align: start;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 24px 22px 20px;
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }

  .news-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .news-card.cat-IT::before      { background: var(--blue); }
  .news-card.cat-과학::before    { background: var(--green); }
  .news-card.cat-보유종목::before { background: var(--yellow); }
  .news-card.cat-의료::before    { background: #f97316; }
  .news-card.cat-기이::before    { background: #e879f9; }
  .news-card.cat-흥미::before    { background: #14b8a6; }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .cat-badge {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .cat-badge.IT       { background: rgba(56,189,248,0.15);  color: var(--blue); }
  .cat-badge.과학     { background: rgba(0,232,122,0.15);   color: var(--green); }
  .cat-badge.보유종목 { background: rgba(251,191,36,0.15);  color: var(--yellow); }
  .cat-badge.의료     { background: rgba(249,115,22,0.15);  color: #f97316; }
  .cat-badge.기이     { background: rgba(232,121,249,0.15); color: #e879f9; }
  .cat-badge.흥미     { background: rgba(20,184,166,0.15);  color: #14b8a6; }

  .stock-tag {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(167,139,250,0.15);
    color: var(--purple);
  }

  .card-date {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .card-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 20px;
    color: #eef2ff;
    flex-shrink: 0;
  }

  .card-summary {
    font-size: 16px;
    color: rgba(205,217,240,0.7);
    line-height: 1.7;
    flex: 1;
    overflow: hidden;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .card-source {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .card-link-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--blue);
    opacity: 0.6;
  }

  /* ── 빈 상태 / 로딩 ── */
  .state-msg {
    flex: 0 0 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 14px;
  }

  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border2);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 진행 도트 ── */
  .dots {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 5px;
    padding: 8px;
    background: var(--bg);
    flex-shrink: 0;
    overflow: hidden;
  }

  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--border2);
    transition: background .2s, transform .2s;
    flex-shrink: 0;
  }

  .dot.active {
    background: var(--blue);
    transform: scale(1.4);
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📰</div>
    NEWS MONITOR
  </div>
  <span id="updated-time">--</span>
</header>

<div class="tabs">
  <button class="tab active" data-tab="all" onclick="switchTab(this,'all')">전체</button>
  <button class="tab" data-tab="holdings" onclick="switchTab(this,'holdings')">📈 보유종목</button>
  <button class="tab" data-tab="tech" onclick="switchTab(this,'tech')">💻 테크·과학</button>
</div>

<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" onclick="setFilter(this,'all')">전체</button>
  <button class="filter-btn" onclick="setFilter(this,'IT')">IT</button>
  <button class="filter-btn" onclick="setFilter(this,'과학')">과학</button>
  <button class="filter-btn" onclick="setFilter(this,'의료')">의료</button>
  <button class="filter-btn" onclick="setFilter(this,'기이')">기이</button>
  <button class="filter-btn" onclick="setFilter(this,'흥미')">흥미</button>
</div>

<div class="card-counter">
  <span id="counter-current">0</span> / <span id="counter-total">0</span>
</div>

<div class="card-slider" id="slider">
  <div class="state-msg">
    <div class="spinner"></div>
    뉴스 불러오는 중...
  </div>
</div>

<div class="dots" id="dots"></div>

<script>
let allData     = null;
let activeTab   = 'all';
let activeFilter = 'all';
let currentItems = [];
let currentIdx  = 0;

const slider = document.getElementById('slider');
const dots   = document.getElementById('dots');
const MAX_DOTS = 20;

async function loadNews() {
  try {
    const res = await fetch('./news.json?t=' + Date.now());
    allData   = await res.json();
    document.getElementById('updated-time').textContent = (allData.updated || '--').slice(5, 16);
    render();
  } catch(e) {
    slider.innerHTML = '<div class="state-msg">❌ 로드 실패</div>';
  }
}

function switchTab(el, tab) {
  activeTab = tab;
  activeFilter = 'all';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const fb = document.getElementById('filter-bar');
  fb.classList.toggle('visible', tab === 'tech');
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn')?.classList.add('active');
  render();
}

function setFilter(el, filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function getItems() {
  if (!allData) return [];
  const holdings = allData.holdings || [];
  const tech     = allData.tech || [];
  if (activeTab === 'holdings') return holdings;
  if (activeTab === 'tech')
    return activeFilter === 'all' ? tech : tech.filter(n => n.category === activeFilter);
  return [...holdings, ...tech];
}

function render() {
  currentItems = getItems();
  currentIdx = 0;

  document.getElementById('counter-total').textContent = currentItems.length;
  document.getElementById('counter-current').textContent = currentItems.length ? 1 : 0;

  if (!currentItems.length) {
    slider.innerHTML = '<div class="state-msg">📭 뉴스 없음</div>';
    dots.innerHTML = '';
    return;
  }

  slider.innerHTML = currentItems.map(cardHTML).join('');

  // 도트 (최대 MAX_DOTS개)
  const showDots = Math.min(currentItems.length, MAX_DOTS);
  dots.innerHTML = Array.from({length: showDots}, (_, i) =>
    `<div class="dot${i === 0 ? ' active' : ''}" data-i="${i}"></div>`
  ).join('');

  slider.scrollTo({ left: 0, behavior: 'instant' });
  observeScroll();
}

function cardHTML(item) {
  const cat   = item.category || 'IT';
  const stock = item.stock ? `<span class="stock-tag">📌 ${item.stock}</span>` : '';
  const date  = (item.date || '').slice(5, 16);
  return `
    <a class="news-card cat-${cat}" href="${item.url || '#'}" target="_blank" rel="noopener">
      <div class="card-meta">
        <span class="cat-badge ${cat}">${cat}</span>
        ${stock}
        <span class="card-date">${date}</span>
      </div>
      <div class="card-title">${item.title || '(제목 없음)'}</div>
      <div class="card-summary">${item.summary || ''}</div>
      <div class="card-footer">
        <span class="card-source">${item.source || ''}</span>
        <span class="card-link-hint">탭하여 원문 ↗</span>
      </div>
    </a>`;
}

function observeScroll() {
  let ticking = false;
  slider.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const idx = Math.round(slider.scrollLeft / slider.clientWidth);
      if (idx !== currentIdx) {
        currentIdx = idx;
        document.getElementById('counter-current').textContent = idx + 1;

        // 도트 업데이트
        const dotIdx = Math.min(idx, MAX_DOTS - 1);
        document.querySelectorAll('.dot').forEach((d, i) => {
          d.classList.toggle('active', i === dotIdx);
        });
      }
      ticking = false;
    });
  }, { passive: true });
}

loadNews();
setInterval(loadNews, 30 * 60 * 1000);
</script>
</body>
</html>
