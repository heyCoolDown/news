name: 뉴스 크롤링 자동화

on:
  schedule:
    # KST 기준 (UTC+9)
    - cron: '0 23 * * *'    # 08:00 KST
    - cron: '30 6 * * *'    # 15:30 KST
    - cron: '0 12 * * *'    # 21:00 KST
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install deep-translator

      - name: 크롤러 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python crawl.py

      - name: news.json 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "chore: news.json 자동 업데이트"
          git push
